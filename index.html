
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VX Protocol</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at center, #0f0f0f 0%, #000000 100%);
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 3em;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
      margin: 0;
    }
    .typewriter {
      overflow: hidden;
      border-right: .15em solid #00ffcc;
      white-space: nowrap;
      margin: 20px auto;
      letter-spacing: .15em;
      animation: typing 4s steps(40, end), blink-caret .75s step-end infinite;
      max-width: 90vw;
    }
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: #00ffcc; }
    }
    .button {
      margin-top: 30px;
      padding: 12px 24px;
      border: 2px solid #00ffcc;
      background: transparent;
      color: #00ffcc;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .button:hover {
      background: #00ffcc;
      color: #000;
      box-shadow: 0 0 10px #00ffcc;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8em;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>ACCESS DENIED</h1>
  <div class="typewriter">Sistema encriptado. Protocolos activos. Intruso detectado.</div>
  <button class="button" onclick="alert('Override rejected. Security level: MAX')">OVERRIDE PROTOCOL</button>
  <footer>VX-ShadowOps © 2025</footer>
</body>
</html>
